<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P11: Newspaper Layout with CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Daily News</h1></header>
<main class="news-layout">
  <article class="main-story"><h2>Main Story</h2><p>This is the main news story. It gets more space than the other columns.</p></article>
  <article><h2>News Two</h2><p>A short update from today.</p></article>
  <article><h2>News Three</h2><p>Another short news update.</p></article>
</main>
</body>
</html>
